{% extends "base.html" %}
{% block title %}Change password — MedGrid{% endblock %}
{% block content %}
<section class="section"><div class="container"><div class="form-card">
  <span class="eyebrow">Account security</span><h2>Change password</h2>
  <form method="post">{% csrf_token %}
    {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
    <button type="submit" class="btn btn-primary btn-block">Update password</button>
  </form>
</div></div></section>
{% endblock %}
