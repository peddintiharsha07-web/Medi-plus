{% extends "base.html" %}
{% block title %}Hospital Profile — MedGrid{% endblock %}
{% block content %}
<section class="section">
  <div class="container">
    <div class="form-card form-card-wide">
      <span class="eyebrow">Hospital details</span>
      <h2>Tell us about your hospital</h2>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group"><label>{{ field.label }}</label>{{ field }}</div>
        {% endfor %}
        <button type="submit" class="btn btn-primary btn-block">Submit for approval</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
